<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rock Paper Scissors</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #1e1e2f;
      color: white;
      padding-top: 50px;
    }

    h1 {
      font-size: 40px;
    }

    button {
      font-size: 24px;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.1);
    }

    #result {
      margin-top: 30px;
      font-size: 24px;
    }

    #score {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>🪨 Rock 📄 Paper ✂️ Scissors</h1>

  <h2>Choose your move!</h2>

  <button onclick="playGame('Rock')">🪨 Rock</button>
  <button onclick="playGame('Paper')">📄 Paper</button>
  <button onclick="playGame('Scissors')">✂️ Scissors</button>

  <div id="result"></div>

  <div id="score">
    You: <span id="playerScore">0</span> |
    Computer: <span id="computerScore">0</span>
  </div>

  <script>
    let playerScore = 0;
    let computerScore = 0;

    function playGame(playerChoice) {

      const choices = ["Rock", "Paper", "Scissors"];

      const computerChoice =
        choices[Math.floor(Math.random() * 3)];

      let result = "";

      if (playerChoice === computerChoice) {
        result = "It's a Draw! 😄";
      }

      else if (
        (playerChoice === "Rock" && computerChoice === "Scissors") ||
        (playerChoice === "Paper" && computerChoice === "Rock") ||
        (playerChoice === "Scissors" && computerChoice === "Paper")
      ) {
        result = "You Win! 🎉";
        playerScore++;
      }

      else {
        result = "Computer Wins! 🤖";
        computerScore++;
      }

      document.getElementById("result").innerHTML =
        `You chose: <b>${playerChoice}</b><br>
         Computer chose: <b>${computerChoice}</b><br><br>
         ${result}`;

      document.getElementById("playerScore").textContent = playerScore;
      document.getElementById("computerScore").textContent = computerScore;
    }
  </script>

</body>
</html>
